name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore AI-Launcher-Studio.sln

      - name: Build
        run: dotnet build AI-Launcher-Studio.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test AI-Launcher-Studio.sln --no-build --configuration Release
