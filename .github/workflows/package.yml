name: Package

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Опубликовать или обновить GitHub Release"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Tag для ручной публикации Release, например v0.1.0"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare package metadata
        id: meta
        shell: pwsh
        env:
          PUBLISH_RELEASE_INPUT: ${{ inputs.publish_release || false }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || '' }}
        run: |
          $refName = $env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($refName)) {
            $refName = "manual"
          }

          $releaseTag = $env:RELEASE_TAG_INPUT
          if ($null -ne $releaseTag) {
            $releaseTag = $releaseTag.Trim()
          }
          if ([string]::IsNullOrWhiteSpace($releaseTag) -and $env:GITHUB_REF_TYPE -eq "tag") {
            $releaseTag = $refName
          }

          $shouldPublishRelease = $env:GITHUB_REF_TYPE -eq "tag" -or $env:PUBLISH_RELEASE_INPUT -eq "true"
          if ($shouldPublishRelease -and [string]::IsNullOrWhiteSpace($releaseTag)) {
            throw "release_tag is required when publishing a GitHub Release from workflow_dispatch."
          }

          $safeRefName = $refName -replace '[^A-Za-z0-9_.-]', '-'
          $packageVersion = if ([string]::IsNullOrWhiteSpace($releaseTag)) { $safeRefName } else { $releaseTag -replace '[^A-Za-z0-9_.-]', '-' }
          if (-not $packageVersion.StartsWith("v", [StringComparison]::OrdinalIgnoreCase)) {
            $packageVersion = "manual-$packageVersion"
          }

          "PACKAGE_REF_NAME=$safeRefName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_BASENAME=AI-Launcher-Studio-$packageVersion-win-x64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SHOULD_PUBLISH_RELEASE=$($shouldPublishRelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "package_ref_name=$safeRefName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_basename=AI-Launcher-Studio-$packageVersion-win-x64" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "should_publish_release=$($shouldPublishRelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          @"
          ## Package metadata

          - Source ref: ``$refName``
          - Package version: ``$packageVersion``
          - Release asset basename: ``AI-Launcher-Studio-$packageVersion-win-x64``
          - Release tag: ``$releaseTag``
          - Publish GitHub Release: ``$shouldPublishRelease``
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore .\AI-Launcher-Studio.sln

      - name: Build
        run: dotnet build .\AI-Launcher-Studio.sln --no-restore

      - name: Test
        run: dotnet test .\AI-Launcher-Studio.sln --no-build

      - name: Publish Windows portable app
        shell: pwsh
        run: |
          $outDir = ".\publish\AI-Launcher-Studio-win-x64"
          dotnet publish .\src\Launcher.Desktop\Launcher.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -o $outDir

          $exe = Join-Path $outDir "Launcher.Desktop.exe"
          if (-not (Test-Path $exe)) {
            throw "Published executable not found: $exe"
          }

      - name: Create portable zip
        shell: pwsh
        run: |
          $outDir = ".\publish\AI-Launcher-Studio-win-x64"
          $zipPath = ".\publish\$env:PACKAGE_BASENAME.zip"
          if (Test-Path $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          $forbidden = Get-ChildItem -Path $outDir -Recurse -File |
            Where-Object {
              $_.Extension -ieq ".gguf" -or
              $_.Name.EndsWith(".download", [StringComparison]::OrdinalIgnoreCase)
            }
          if ($forbidden) {
            $names = ($forbidden | Select-Object -ExpandProperty FullName) -join "`n"
            throw "Portable package contains forbidden local artifacts:`n$names"
          }

          Compress-Archive -Path (Join-Path $outDir "*") -DestinationPath $zipPath -Force
          if (-not (Test-Path $zipPath)) {
            throw "Portable zip was not created: $zipPath"
          }

          $hashPath = "$zipPath.sha256"
          $stream = [System.IO.File]::OpenRead($zipPath)
          try {
            $sha256 = [System.Security.Cryptography.SHA256]::Create()
            try {
              $hashText = -join ($sha256.ComputeHash($stream) | ForEach-Object { $_.ToString("x2") })
            } finally {
              $sha256.Dispose()
            }
          } finally {
            $stream.Dispose()
          }
          $hashLine = "{0}  {1}" -f $hashText, (Split-Path -Leaf $zipPath)
          Set-Content -Path $hashPath -Value $hashLine -Encoding ascii
          Write-Host "SHA256: $hashLine"
          if (-not (Test-Path $hashPath) -or (Get-Item $hashPath).Length -le 0) {
            throw "SHA256 file was not created: $hashPath"
          }

      - name: Verify portable package SHA256
        shell: pwsh
        run: |
          $zipPath = ".\publish\$env:PACKAGE_BASENAME.zip"
          $hashPath = "$zipPath.sha256"

          if (-not (Test-Path $zipPath)) {
            throw "Portable zip not found: $zipPath"
          }
          if (-not (Test-Path $hashPath)) {
            throw "SHA256 file not found: $hashPath"
          }

          $hashLine = (Get-Content -Path $hashPath -TotalCount 1)
          if (-not $hashLine) {
            throw "SHA256 file is empty: $hashPath"
          }

          $expectedHash = ($hashLine -split "\s+")[0]
          $actualHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedHash.ToLowerInvariant() -ne $actualHash) {
            throw "SHA256 mismatch for $zipPath. Expected $expectedHash, got $actualHash."
          }

          Write-Host "Verified SHA256: $actualHash"

      - name: Create manual release prep guide
        shell: pwsh
        run: |
          $guidePath = ".\publish\GITHUB_RELEASE_PREP_RU.md"
          $zipName = "$env:PACKAGE_BASENAME.zip"
          $hashName = "$zipName.sha256"

          @"
          # Ручная подготовка GitHub Release

          Workflow подготовил артефакты для ref ``$env:GITHUB_REF_NAME`` / version ``$env:PACKAGE_VERSION``.

          ## Assets для релиза

          - ``$zipName``
          - ``$hashName``
          - ``RELEASE_NOTES_RU.md`` как текст описания релиза

          ## Чеклист публикации вручную

          1. Откройте успешный run workflow ``Package``.
          2. Скачайте artifact ``AI-Launcher-Studio-$env:PACKAGE_VERSION-win-x64``.
          3. Проверьте checksum из ``$hashName``.
          4. Создайте GitHub Release вручную для нужного tag.
          5. Прикрепите ``$zipName`` и ``$hashName``.
          6. Вставьте содержимое ``RELEASE_NOTES_RU.md`` в описание релиза.

          Автоматическая публикация включается для tag ``v*`` или при ручном запуске с ``publish_release=true`` и заполненным ``release_tag``.
          "@ | Set-Content -Path $guidePath -Encoding utf8

      - name: Publish GitHub Release
        if: steps.meta.outputs.should_publish_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zipPath = ".\publish\$env:PACKAGE_BASENAME.zip"
          $hashPath = "$zipPath.sha256"
          $notesPath = ".\docs\RELEASE_NOTES_RU.md"

          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            throw "RELEASE_TAG is empty."
          }
          if (-not (Test-Path $zipPath)) {
            throw "Portable zip not found: $zipPath"
          }
          if (-not (Test-Path $hashPath)) {
            throw "SHA256 file not found: $hashPath"
          }
          if (-not (Test-Path $notesPath)) {
            throw "Release notes not found: $notesPath"
          }

          $zipAsset = "{0}#AI-Launcher-Studio-{1}-win-x64.zip" -f $zipPath, $env:PACKAGE_VERSION
          $hashAsset = "{0}#AI-Launcher-Studio-{1}-win-x64.zip.sha256" -f $hashPath, $env:PACKAGE_VERSION
          $releaseTitle = "AI Launcher Studio $env:PACKAGE_VERSION"

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $zipAsset $hashAsset --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "gh release upload failed."
            }
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title $releaseTitle --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) {
              throw "gh release edit failed."
            }
          } else {
            gh release create $env:RELEASE_TAG $zipAsset $hashAsset --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $releaseTitle --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) {
              throw "gh release create failed."
            }
          }

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: AI-Launcher-Studio-${{ steps.meta.outputs.package_version }}-win-x64
          path: |
            .\publish\${{ steps.meta.outputs.package_basename }}.zip
            .\publish\${{ steps.meta.outputs.package_basename }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: AI-Launcher-Studio-${{ steps.meta.outputs.package_version }}-release-notes
          path: .\docs\RELEASE_NOTES_RU.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload manual release prep guide
        uses: actions/upload-artifact@v4
        with:
          name: AI-Launcher-Studio-${{ steps.meta.outputs.package_version }}-release-prep
          path: .\publish\GITHUB_RELEASE_PREP_RU.md
          if-no-files-found: error
          retention-days: 14
