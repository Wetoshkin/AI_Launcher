name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare package metadata
        id: meta
        shell: pwsh
        run: |
          $refName = $env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($refName)) {
            $refName = "manual"
          }

          $safeRefName = $refName -replace '[^A-Za-z0-9_.-]', '-'
          $packageVersion = $safeRefName
          if (-not $packageVersion.StartsWith("v", [StringComparison]::OrdinalIgnoreCase)) {
            $packageVersion = "manual-$packageVersion"
          }

          "PACKAGE_REF_NAME=$safeRefName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_BASENAME=AI-Launcher-Studio-$packageVersion-win-x64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "package_ref_name=$safeRefName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_basename=AI-Launcher-Studio-$packageVersion-win-x64" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          @"
          ## Package metadata

          - Source ref: ``$refName``
          - Package version: ``$packageVersion``
          - Release asset basename: ``AI-Launcher-Studio-$packageVersion-win-x64``
          - This workflow only prepares artifacts. Create and publish the GitHub Release manually.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore .\llama-server-launcher-avalonia.sln

      - name: Build
        run: dotnet build .\llama-server-launcher-avalonia.sln --no-restore

      - name: Test
        run: dotnet test .\llama-server-launcher-avalonia.sln --no-build

      - name: Publish Windows portable app
        shell: pwsh
        run: |
          $outDir = ".\publish\AI-Launcher-Studio-win-x64"
          dotnet publish .\src\Launcher.Desktop\Launcher.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -o $outDir

          $exe = Join-Path $outDir "Launcher.Desktop.exe"
          if (-not (Test-Path $exe)) {
            throw "Published executable not found: $exe"
          }

      - name: Create portable zip
        shell: pwsh
        run: |
          $outDir = ".\publish\AI-Launcher-Studio-win-x64"
          $zipPath = ".\publish\$env:PACKAGE_BASENAME.zip"
          if (Test-Path $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          $forbidden = Get-ChildItem -Path $outDir -Recurse -File |
            Where-Object {
              $_.Extension -ieq ".gguf" -or
              $_.Name.EndsWith(".download", [StringComparison]::OrdinalIgnoreCase)
            }
          if ($forbidden) {
            $names = ($forbidden | Select-Object -ExpandProperty FullName) -join "`n"
            throw "Portable package contains forbidden local artifacts:`n$names"
          }

          Compress-Archive -Path (Join-Path $outDir "*") -DestinationPath $zipPath -Force
          if (-not (Test-Path $zipPath)) {
            throw "Portable zip was not created: $zipPath"
          }

          $hashPath = "$zipPath.sha256"
          $stream = [System.IO.File]::OpenRead($zipPath)
          try {
            $sha256 = [System.Security.Cryptography.SHA256]::Create()
            try {
              $hashText = -join ($sha256.ComputeHash($stream) | ForEach-Object { $_.ToString("x2") })
            } finally {
              $sha256.Dispose()
            }
          } finally {
            $stream.Dispose()
          }
          $hashLine = "{0}  {1}" -f $hashText, (Split-Path -Leaf $zipPath)
          Set-Content -Path $hashPath -Value $hashLine -Encoding ascii
          Write-Host "SHA256: $hashLine"
          if (-not (Test-Path $hashPath) -or (Get-Item $hashPath).Length -le 0) {
            throw "SHA256 file was not created: $hashPath"
          }

      - name: Verify portable package SHA256
        shell: pwsh
        run: |
          $zipPath = ".\publish\$env:PACKAGE_BASENAME.zip"
          $hashPath = "$zipPath.sha256"

          if (-not (Test-Path $zipPath)) {
            throw "Portable zip not found: $zipPath"
          }
          if (-not (Test-Path $hashPath)) {
            throw "SHA256 file not found: $hashPath"
          }

          $hashLine = (Get-Content -Path $hashPath -TotalCount 1)
          if (-not $hashLine) {
            throw "SHA256 file is empty: $hashPath"
          }

          $expectedHash = ($hashLine -split "\s+")[0]
          $actualHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedHash.ToLowerInvariant() -ne $actualHash) {
            throw "SHA256 mismatch for $zipPath. Expected $expectedHash, got $actualHash."
          }

          Write-Host "Verified SHA256: $actualHash"

      - name: Create manual release prep guide
        shell: pwsh
        run: |
          $guidePath = ".\publish\GITHUB_RELEASE_PREP_RU.md"
          $zipName = "$env:PACKAGE_BASENAME.zip"
          $hashName = "$zipName.sha256"

          @"
          # Ручная подготовка GitHub Release

          Workflow подготовил артефакты для ref ``$env:GITHUB_REF_NAME`` / version ``$env:PACKAGE_VERSION``.

          ## Assets для релиза

          - ``$zipName``
          - ``$hashName``
          - ``RELEASE_NOTES_RU.md`` как текст описания релиза

          ## Чеклист публикации

          1. Откройте успешный run workflow ``Package`` для tag ``v*``.
          2. Скачайте artifact ``AI-Launcher-Studio-$env:PACKAGE_VERSION-win-x64``.
          3. Проверьте checksum из ``$hashName``.
          4. Создайте GitHub Release вручную для того же tag.
          5. Прикрепите ``$zipName`` и ``$hashName``.
          6. Вставьте содержимое ``RELEASE_NOTES_RU.md`` в описание релиза.

          Workflow не создает и не публикует GitHub Release автоматически.
          "@ | Set-Content -Path $guidePath -Encoding utf8

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: AI-Launcher-Studio-${{ steps.meta.outputs.package_version }}-win-x64
          path: |
            .\publish\${{ steps.meta.outputs.package_basename }}.zip
            .\publish\${{ steps.meta.outputs.package_basename }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: AI-Launcher-Studio-${{ steps.meta.outputs.package_version }}-release-notes
          path: .\docs\RELEASE_NOTES_RU.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload manual release prep guide
        uses: actions/upload-artifact@v4
        with:
          name: AI-Launcher-Studio-${{ steps.meta.outputs.package_version }}-release-prep
          path: .\publish\GITHUB_RELEASE_PREP_RU.md
          if-no-files-found: error
          retention-days: 14
