name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore .\llama-server-launcher-avalonia.sln

      - name: Build
        run: dotnet build .\llama-server-launcher-avalonia.sln --no-restore

      - name: Test
        run: dotnet test .\llama-server-launcher-avalonia.sln --no-build

      - name: Publish Windows portable app
        shell: pwsh
        run: |
          $outDir = ".\publish\AI-Launcher-Studio-win-x64"
          dotnet publish .\src\Launcher.Desktop\Launcher.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -o $outDir

          $exe = Join-Path $outDir "Launcher.Desktop.exe"
          if (-not (Test-Path $exe)) {
            throw "Published executable not found: $exe"
          }

      - name: Create portable zip
        shell: pwsh
        run: |
          $outDir = ".\publish\AI-Launcher-Studio-win-x64"
          $zipPath = ".\publish\AI-Launcher-Studio-win-x64.zip"
          if (Test-Path $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          $forbidden = Get-ChildItem -Path $outDir -Recurse -File |
            Where-Object {
              $_.Extension -ieq ".gguf" -or
              $_.Name.EndsWith(".download", [StringComparison]::OrdinalIgnoreCase)
            }
          if ($forbidden) {
            $names = ($forbidden | Select-Object -ExpandProperty FullName) -join "`n"
            throw "Portable package contains forbidden local artifacts:`n$names"
          }

          Compress-Archive -Path (Join-Path $outDir "*") -DestinationPath $zipPath -Force
          if (-not (Test-Path $zipPath)) {
            throw "Portable zip was not created: $zipPath"
          }

          $hashPath = "$zipPath.sha256"
          $stream = [System.IO.File]::OpenRead($zipPath)
          try {
            $sha256 = [System.Security.Cryptography.SHA256]::Create()
            try {
              $hashText = -join ($sha256.ComputeHash($stream) | ForEach-Object { $_.ToString("x2") })
            } finally {
              $sha256.Dispose()
            }
          } finally {
            $stream.Dispose()
          }
          $hashLine = "{0}  {1}" -f $hashText, (Split-Path -Leaf $zipPath)
          Set-Content -Path $hashPath -Value $hashLine -Encoding ascii
          Write-Host "SHA256: $hashLine"
          if (-not (Test-Path $hashPath) -or (Get-Item $hashPath).Length -le 0) {
            throw "SHA256 file was not created: $hashPath"
          }

      - name: Verify portable package SHA256
        shell: pwsh
        run: |
          $zipPath = ".\publish\AI-Launcher-Studio-win-x64.zip"
          $hashPath = "$zipPath.sha256"

          if (-not (Test-Path $zipPath)) {
            throw "Portable zip not found: $zipPath"
          }
          if (-not (Test-Path $hashPath)) {
            throw "SHA256 file not found: $hashPath"
          }

          $hashLine = (Get-Content -Path $hashPath -TotalCount 1)
          if (-not $hashLine) {
            throw "SHA256 file is empty: $hashPath"
          }

          $expectedHash = ($hashLine -split "\s+")[0]
          $actualHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedHash.ToLowerInvariant() -ne $actualHash) {
            throw "SHA256 mismatch for $zipPath. Expected $expectedHash, got $actualHash."
          }

          Write-Host "Verified SHA256: $actualHash"

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: AI-Launcher-Studio-win-x64
          path: |
            .\publish\AI-Launcher-Studio-win-x64.zip
            .\publish\AI-Launcher-Studio-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: AI-Launcher-Studio-release-notes
          path: .\docs\RELEASE_NOTES_RU.md
          if-no-files-found: error
          retention-days: 14
